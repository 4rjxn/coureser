<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teacher - CMS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; }
        hr { display: none; }
        a { color: var(--primary); text-decoration: none; }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background-color: var(--bg-sidebar); color: #94a3b8; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 0.75rem; }
        .sidebar-brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #0f172a, #475569); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
        .sidebar-title { color: #fff; font-size: 1.1rem; font-weight: 700; }
        .sidebar-subtitle { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }

        .sidebar-nav { padding: 1.25rem 0.75rem; flex: 1; display: flex; flex-direction: column; gap: 0.35rem; }
        .sidebar-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: #94a3b8; border-radius: var(--radius-md); font-weight: 500; font-size: 0.95rem; transition: all 0.2s; }
        .sidebar-nav-item:hover { background-color: #1e293b; color: #fff; }
        .sidebar-nav-item.active { background-color: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(15,23,42,0.3); }
        .sidebar-nav-item.logout { margin-top: auto; color: #f87171; }
        .sidebar-nav-item.logout:hover { background-color: rgba(239,68,68,0.15); color: #fca5a5; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .top-navbar { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .page-title { font-size: 1.35rem; font-weight: 700; color: #0f172a; }

        .content-body { padding: 2rem; flex: 1; max-width: 900px; width: 100%; margin: 0 auto; }

        .card-section { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 2rem; box-shadow: var(--shadow-sm); }
        
        fieldset { border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 1.5rem; background: #fff; }
        legend { font-weight: 600; font-size: 0.95rem; padding: 0 0.5rem; color: var(--primary); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.875rem; font-weight: 600; color: #334155; }
        .form-control { width: 100%; padding: 0.65rem 0.9rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.95rem; font-family: inherit; outline: none; transition: all 0.2s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,23,42,0.15); }

        .btn-group { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.5rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.2s; text-decoration: none; }
        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { background-color: #e2e8f0; }

        footer { text-align: center; padding: 1.25rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-color); background: var(--bg-card); margin-top: auto; }

        @media (max-width: 992px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; }
            .sidebar-nav { flex-direction: row; flex-wrap: wrap; }
            .sidebar-nav-item.logout { margin-top: 0; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand-icon">CMS</div>
            <div>
                <div class="sidebar-title">Course Management</div>
                <div class="sidebar-subtitle">Admin Panel</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-nav-item">Dashboard</a>
            <a href="/admin/students" class="sidebar-nav-item">Students</a>
            <a href="/admin/courses" class="sidebar-nav-item">Courses</a>
            <a href="/admin/registrations" class="sidebar-nav-item">Registrations</a>
            <a href="/admin/teachers" class="sidebar-nav-item">Teachers</a>
            <a href="/logout" class="sidebar-nav-item logout">Logout</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="top-navbar">
            <h1 class="page-title">Add New Teacher</h1>
            <a href="/admin/teachers" class="btn btn-secondary">&larr; Back to Teacher List</a>
        </header>

        <main class="content-body">
            <div class="card-section">
                <form action="/admin/teachers/add" method="post">
                    <fieldset>
                        <legend>Account Credentials</legend>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. prof_turing" required>
                            </div>
                            <div class="form-group">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Prof. Alan Turing" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="turing@university.edu" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter secure password" required>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Teacher Specific Info</legend>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="teacherId">Teacher ID</label>
                                <input type="text" id="teacherId" name="teacherId" class="form-control" placeholder="e.g. T2001" required>
                            </div>
                            <div class="form-group">
                                <label for="department">Department</label>
                                <input type="text" id="department" name="department" class="form-control" placeholder="e.g. Computer Science" required>
                            </div>
                        </div>
                    </fieldset>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">Add Teacher Account</button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            Course Management System &bull; Admin Operations
        </footer>
    </div>
</div>

</body>
</html>
