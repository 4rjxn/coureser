<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
</head>
<body>

<header>

    <h1>Course Management System</h1>

    <p>Add Student</p>

    <hr>

</header>

<nav>

    <a href="/admin/dashboard">Dashboard</a> |
    <a href="/admin/students">Students</a> |
    <a href="/admin/teachers">Teachers</a> |
    <a href="/admin/courses">Courses</a> |
    <a href="/admin/registrations">Registrations</a> |
    <a href="/logout">Logout</a>

</nav>

<hr>

<main>

<form action="/admin/students/add" method="post">

    <fieldset>

        <legend>Account Information</legend>

        <p>

            <label for="username">
                Username
            </label>

            <br>

            <input
                type="text"
                id="username"
                name="username"
                required>

        </p>

        <p>

            <label for="name">
                Full Name
            </label>

            <br>

            <input
                type="text"
                id="name"
                name="name"
                required>

        </p>

        <p>

            <label for="email">
                Email
            </label>

            <br>

            <input
                type="email"
                id="email"
                name="email"
                required>

        </p>

        <p>

            <label for="password">
                Password
            </label>

            <br>

            <input
                type="password"
                id="password"
                name="password"
                required>

        </p>

    </fieldset>

    <br>

    <fieldset>

        <legend>Student Information</legend>

        <p>

            <label for="studentId">
                Student ID
            </label>

            <br>

            <input
                type="text"
                id="studentId"
                name="studentId"
                required>

        </p>

        <p>

            <label for="maxCredits">
                Maximum Credits
            </label>

            <br>

            <input
                type="number"
                id="maxCredits"
                name="maxCredits"
                min="1"
                required>

        </p>

    </fieldset>

    <br>

    <button type="submit">
        Add Student
    </button>

    <button type="reset">
        Clear
    </button>

</form>

</main>

<hr>

<footer>

<p>

    <a href="/admin/students">
        Back to Student List
    </a>

</p>

</footer>

</body>
</html>
