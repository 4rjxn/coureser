<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>
</head>
<body>

<header>

    <h1>Course Management System</h1>

    <p>Edit Course</p>

    <hr>

</header>

<nav>

    <a href="/admin/dashboard">Dashboard</a> |
    <a href="/admin/students">Students</a> |
    <a href="/admin/teachers">Teachers</a> |
    <a href="/admin/courses">Courses</a> |
    <a href="/admin/registrations">Registrations</a> |
    <a href="/logout">Logout</a>

</nav>

<hr>

<main>

<form action="/admin/courses/edit" method="post">

    <input
        type="hidden"
        name="courseId"
        value="{{courseId}}">

    <fieldset>

        <legend>Course Information</legend>

        <p>

            <label for="code">
                Course Code
            </label>

            <br>

            <input
                type="text"
                id="code"
                name="code"
                value="{{code}}"
                required>

        </p>

        <p>

            <label for="title">
                Course Title
            </label>

            <br>

            <input
                type="text"
                id="title"
                name="title"
                value="{{title}}"
                required>

        </p>

        <p>

            <label for="description">
                Description
            </label>

            <br>

            <textarea
                id="description"
                name="description"
                rows="6"
                cols="50">{{description}}</textarea>

        </p>

        <p>

            <label for="credits">
                Credits
            </label>

            <br>

            <input
                type="number"
                id="credits"
                name="credits"
                min="1"
                value="{{credits}}"
                required>

        </p>

        <p>

            <label for="maxEnrollment">
                Maximum Enrollment
            </label>

            <br>

            <input
                type="number"
                id="maxEnrollment"
                name="maxEnrollment"
                min="1"
                value="{{maxEnrollment}}"
                required>

        </p>

    </fieldset>

    <br>

    <fieldset>

        <legend>Teacher Assignment</legend>

        <p>

            <label for="teacherId">
                Assigned Teacher
            </label>

            <br>

            <select
                id="teacherId"
                name="teacherId">

                {{teacherOptions}}

            </select>

        </p>

    </fieldset>

    <br>

    <fieldset>

        <legend>Prerequisites</legend>

        <p>

            <label for="prerequisites">
                Prerequisite Courses
            </label>

            <br>

            <select
                id="prerequisites"
                name="prerequisites"
                multiple
                size="8">

                {{prerequisiteOptions}}

            </select>

        </p>

        <p>

            Hold Ctrl (Windows/Linux) or Command (macOS)
            to select multiple prerequisite courses.

        </p>

    </fieldset>

    <br>

    <button type="submit">
        Save Changes
    </button>

    <button type="reset">
        Reset
    </button>

    <a href="/admin/courses">
        Cancel
    </a>

</form>

</main>

<hr>

<footer>

<p>

    <a href="/admin/courses">
        Back to Course List
    </a>

</p>

</footer>

</body>
</html>
